[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archway-tui-installer"
version = "0.1.0"
description = "Keyboard-driven Arch Linux Live ISO installer with reviewed disk plans"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
archway = "main:main"

[tool.setuptools]
packages = ["installer", "tui"]
py-modules = ["main"]
