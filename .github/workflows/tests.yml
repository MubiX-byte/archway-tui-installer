name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python main.py --demo --plan
      - run: python main.py --demo --plan --firmware BIOS
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tui-smoke.py
      - run: sudo apt-get update -qq && sudo apt-get install -y fdisk
      - run: python scripts/storage-smoke.py
      - run: bash -n scripts/run-installer.sh scripts/qemu-test.sh
      - name: Verify POSIX shell launchers and argument forwarding
        run: |
          sh -n start.sh scripts/run-installer.sh
          sh start.sh --demo --plan
          sh scripts/run-installer.sh --demo --plan --firmware BIOS
          cd /tmp
          sh "$GITHUB_WORKSPACE/start.sh" --version
